[project]
name = "on-track"
version = "0.1.0"
description = "LED-style departure board for a SEPTA Regional Rail station"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "brotli>=1.2.1",
    "fonttools>=4.68.0",
    "isort>=9.0.2",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.isort]
profile = "black"
line_length = 80

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
