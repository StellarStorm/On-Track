<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On Track Control</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f4f4f2;
        --card: #ffffff;
        --text: #1d1e20;
        --muted: #6b6e73;
        --border: #dcdcd8;
        --accent: #0b46d6;
        --accent-text: #ffffff;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f1115;
          --card: #181b21;
          --text: #e6e8ec;
          --muted: #959cab;
          --border: #2b303a;
          --accent: #3d6bff;
          --error: #ff8a80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--background);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 24px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .note {
        color: var(--muted);
        font-size: 13px;
        margin: 8px 0 0;
      }
      .choices {
        display: flex;
        gap: 6px;
      }
      .choices button {
        flex: 1;
        padding: 10px 8px;
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
      }
      .choices button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      select {
        width: 100%;
        padding: 10px;
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      button:disabled,
      select:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      #status {
        min-height: 1.5em;
        color: var(--muted);
        font-size: 14px;
        margin: 4px 0 16px;
      }
      #status.error {
        color: var(--error);
      }
      .links {
        font-size: 14px;
        color: var(--muted);
      }
      .links a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>On Track</h1>
      <p class="intro">
        Choose what the display shows. Changes reach it within a few
        seconds.
      </p>

      <section>
        <h2 id="view-label">Show</h2>
        <div class="choices" role="group" aria-labelledby="view-label" data-setting="view">
          <button type="button" value="board">Departure board</button>
          <button type="button" value="map">Live map</button>
        </div>
      </section>

      <section>
        <h2><label for="station">Station</label></h2>
        <select id="station"></select>
        <p class="note">For the departure board.</p>
      </section>

      <section>
        <h2 id="direction-label">Direction</h2>
        <div class="choices" role="group" aria-labelledby="direction-label" data-setting="direction">
          <button type="button" value="both">Both</button>
          <button type="button" value="northbound">Northbound</button>
          <button type="button" value="southbound">Southbound</button>
        </div>
        <p class="note">Which trains the departure board lists.</p>
      </section>

      <p id="status" role="status"></p>

      <p class="links">
        Open here: <a href="/">display</a> · <a href="/board">board</a> ·
        <a href="/map">map</a>
      </p>
    </main>

    <script>
      const POLL_SECONDS = 5;
      const status = document.getElementById("status");
      const stationSelect = document.getElementById("station");
      let current = null;
      let busy = false;

      function setStatus(text, isError = false) {
        status.textContent = text;
        status.className = isError ? "error" : "";
      }

      function show(settings) {
        current = settings;
        for (const group of document.querySelectorAll("[data-setting]")) {
          const value = settings[group.dataset.setting];
          for (const button of group.querySelectorAll("button")) {
            button.setAttribute("aria-pressed", String(button.value === value));
          }
        }
        // A station set in config.toml may not be in SEPTA's list (an old
        // name, say); show it anyway.
        if (![...stationSelect.options].some((o) => o.value === settings.station)) {
          stationSelect.prepend(new Option(settings.station, settings.station));
        }
        stationSelect.value = settings.station;
      }

      function setBusy(value) {
        busy = value;
        for (const control of document.querySelectorAll("button, select")) {
          control.disabled = value;
        }
      }

      async function change(setting, value) {
        if (busy || !current || current[setting] === value) {
          return;
        }
        setBusy(true);
        setStatus("Saving…");
        try {
          const response = await fetch("/control", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ [setting]: value }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          show(data);
          setStatus(`Saved. The display switches within ${POLL_SECONDS} seconds.`);
        } catch (error) {
          show(current);
          setStatus(`Couldn't save: ${error.message}`, true);
        } finally {
          setBusy(false);
        }
      }

      async function refresh() {
        if (busy) {
          return;
        }
        try {
          const response = await fetch("/display", { cache: "no-store" });
          show(await response.json());
        } catch {
          setStatus("Can't reach the On Track server.", true);
        }
      }

      async function start() {
        try {
          const response = await fetch("/static/stations.json");
          for (const station of await response.json()) {
            stationSelect.append(new Option(station.name, station.api));
          }
        } catch {
          setStatus("Couldn't load the station list; run scripts/build_map.py.", true);
        }
        await refresh();
        setInterval(refresh, POLL_SECONDS * 1000);
      }

      for (const group of document.querySelectorAll("[data-setting]")) {
        group.addEventListener("click", (event) => {
          const button = event.target.closest("button");
          if (button) {
            change(group.dataset.setting, button.value);
          }
        });
      }
      stationSelect.addEventListener("change", () => change("station", stationSelect.value));
      start();
    </script>
  </body>
</html>
