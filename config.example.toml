# Copy to config.toml and edit. Every setting is optional.

# SEPTA's name for the station. See the station list in the README.
station = "Jefferson Station"

# Header text. Defaults to the station name without " Station".
# title = "Jefferson"

# "both", "northbound" or "southbound"
direction = "both"

# Number of departures on the board (1-12).
rows = 8

# How often to ask SEPTA for new data, in seconds (15 or more).
refresh_seconds = 30

# "12" or "24" hour times.
time_format = "12"

# host = "0.0.0.0"
# port = 8000
# log_level = "INFO"
